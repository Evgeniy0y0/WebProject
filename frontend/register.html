<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — AdBoard</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; }
        .field { margin-bottom: 16px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input { display: block; width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; }
        input.error { border: 2px solid #ff4d4d; background-color: #fff3f3; }
        input.valid { border: 2px solid #2ecc71; background-color: #f2fcf6; }
        .field-error { color: #ff4d4d; font-size: 12px; min-height: 16px; display: block; margin-top: 4px; }
        #submitBtn { width: 100%; padding: 10px; background: #3498db; color: white; border: none; cursor: pointer; font-size: 16px; }
        #submitBtn:disabled { opacity: 0.5; cursor: not-allowed; background: #95a5a6; }
        #serverErrors p { color: #ff4d4d; margin: 4px 0; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Create Account</h1>
    <div id="serverErrors"></div>

    <form id="registerForm">
        <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Your name" required>
            <span class="field-error" id="nameError"></span>
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Your email address" required>
            <span class="field-error" id="emailError"></span>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Minimum 8 characters" required>
            <span class="field-error" id="passwordError"></span>
        </div>
        <div class="field">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat your password" required>
            <span class="field-error" id="confirmError"></span>
        </div>
        <button type="submit" id="submitBtn" disabled>Register</button>
    </form>

    <script>
        const API_URL = 'http://127.0.0.1:3000';
        
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');

        function setError(input, errorEl, message) {
            input.classList.add('error');
            input.classList.remove('valid');
            errorEl.textContent = message;
        }

        function setValid(input, errorEl) {
            input.classList.remove('error');
            input.classList.add('valid');
            errorEl.textContent = '';
        }

        function validateForm() {
            let isValid = true;

            if (nameInput.value.trim().length < 2) {
                setError(nameInput, document.getElementById('nameError'), 'Name must be at least 2 characters');
                isValid = false;
            } else {
                setValid(nameInput, document.getElementById('nameError'));
            }

            if (!emailInput.value.includes('@') || emailInput.value.trim().length < 5) {
                setError(emailInput, document.getElementById('emailError'), 'Please enter a valid email address');
                isValid = false;
            } else {
                setValid(emailInput, document.getElementById('emailError'));
            }

            if (passwordInput.value.length < 8) {
                setError(passwordInput, document.getElementById('passwordError'), 'Password must be at least 8 characters');
                isValid = false;
            } else {
                setValid(passwordInput, document.getElementById('passwordError'));
            }

            if (confirmInput.value !== passwordInput.value) {
                setError(confirmInput, document.getElementById('confirmError'), 'Passwords do not match');
                isValid = false;
            } else if (!confirmInput.value) {
                setError(confirmInput, document.getElementById('confirmError'), 'Please confirm your password');
                isValid = false;
            } else {
                setValid(confirmInput, document.getElementById('confirmError'));
            }

            submitBtn.disabled = !isValid;
        }

        [nameInput, emailInput, passwordInput, confirmInput].forEach(input => {
            input.addEventListener('input', validateForm);
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('serverErrors').innerHTML = '';

            try {
                const response = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: nameInput.value.trim(),
                        email: emailInput.value.trim(),
                        password: passwordInput.value,
                        confirmPassword: confirmInput.value
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    const container = document.getElementById('serverErrors');
                    const msgs = data.errors || [data.message];
                    container.innerHTML = msgs.map(m => `<p>• ${m}</p>`).join('');
                    return;
                }

                window.location.href = 'index.html';
            } catch (err) {
                document.getElementById('serverErrors').innerHTML = '<p>Server connection refused.</p>';
            }
        });
    </script>
</body>
</html>
