<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Створити оголошення</title>
</head>
<body>
    <h1>Нове оголошення</h1>
    <form id="createAdForm">
        <input type="text" id="title" placeholder="Назва" required><br><br>
        <textarea id="description" placeholder="Опис" required></textarea><br><br>
        <input type="number" id="price" placeholder="Ціна" required><br><br>
        <input type="text" id="location" placeholder="Місто/Локація" required><br><br>
        <select id="category">
            <option value="electronics">Електроніка</option>
            <option value="cars">Авто</option>
            <option value="realty">Нерухомість</option>
            <option value="other">Інше</option>
        </select><br><br>
        <button type="submit">Опублікувати</button>
    </form>
    <p id="message" style="color: red;"></p>
    <a href="index.html">Назад до списку</a>

<script>
    const API_URL = 'http://127.0.0.1:3000';

    document.getElementById('createAdForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const body = {
            title: document.getElementById('title').value,
            price: document.getElementById('price').value,
            description: document.getElementById('description').value,
            location: document.getElementById('location').value,
            category: document.getElementById('category').value
        };

        try {
            const response = await fetch(`${API_URL}/api/ads`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(body)
            });

            const data = await response.json();

            if (!response.ok) {
                alert(data.message || 'Помилка при створенні');
                return;
            }

            alert('Оголошення успешно створено!');
            window.location.href = 'index.html';
        } catch (error) {
            console.error('Помилка:', error);
            alert('Не вдалося з’єднатися з сервером');
        }
    });
</script>
</body>
</html>
