<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AdBoard - Home</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
        nav { margin-bottom: 20px; }
        .ad-card { border: 1px solid #ccc; margin-bottom: 15px; padding: 15px; border-radius: 4px; }
        .ad-card h3 { margin-top: 0; color: #2c3e50; }
        .inquiry-btn { display: inline-block; margin-top: 10px; padding: 6px 12px; background: #2ecc71; color: white; text-decoration: none; border-radius: 4px; font-size: 14px; }
        .inquiry-btn:hover { background: #27ae60; }
    </style>
</head>
<body>
    <h1>Latest Advertisements</h1>
    <nav>
        <a href="login.html">Login</a> |
        <a href="register.html">Register</a> |
        <a href="create.html">Create Advertisement</a> |
        <button id="logoutBtn">Logout</button>
    </nav>
    <hr>
    <div id="adsList">Loading...</div>

    <script>
        const API_URL = 'http://127.0.0.1:3000';
        
        async function loadAds() {
            try {
                const response = await fetch(`${API_URL}/api/ads`, {
                    method: 'GET',
                    credentials: 'include'
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        document.getElementById('adsList').innerHTML = 'Please <a href="login.html">login</a> to view advertisements.';
                    } else {
                        document.getElementById('adsList').innerHTML = 'Error loading advertisements.';
                    }
                    return;
                }

                const data = await response.json();
                const container = document.getElementById('adsList');
                const ads = data.data || data;

                if (!ads || ads.length === 0) {
                    container.innerHTML = 'No advertisements available yet.';
                    return;
                }

                container.innerHTML = ads.map(ad => `
                    <div class="ad-card">
                        <h3>${ad.title} — $${ad.price}</h3>
                        <p><strong>Location:</strong> ${ad.location} | <strong>Category:</strong> ${ad.category}</p>
                        <p>${ad.description}</p>
                        <a href="inquiry.html?adId=${ad._id}" class="inquiry-btn">Send Inquiry to Seller</a>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('adsList').innerHTML = 'Could not connect to server.';
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                const response = await fetch(`${API_URL}/api/auth/logout`, { 
                    method: 'POST', 
                    credentials: 'include'
                });

                if (response.ok) {
                    window.location.href = 'login.html';
                }
            } catch (err) {
                console.error('Logout error:', err);
            }
        });

        loadAds();
    </script>
</body>
</html>
