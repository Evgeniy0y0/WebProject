<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>AdBoard - Головна</title>
</head>
<body>
    <h1>Останні оголошення</h1>
    <nav>
        <a href="/login.html">Увійти</a> |
        <a href="/register.html">Реєстрація</a> |
        <a href="/create.html">Подати оголошення</a> |
        <button id="logoutBtn">Вийти</button>
    </nav>
    <hr>
    <div id="adsList">Завантаження...</div>

    <script>
        async function loadAds() {
            const response = await fetch('/api/ads');
            const data = await response.json();
            const container = document.getElementById('adsList');

            if (data.data.length === 0) {
                container.innerHTML = 'Оголошень поки немає.';
                return;
            }

            container.innerHTML = data.data.map(ad => `
                <div style="border: 1px solid #ccc; margin-bottom: 10px; padding: 10px;">
                    <h3>${ad.title} — ${ad.price} грн</h3>
                    <p>Локація: ${ad.location} | Категорія: ${ad.category}</p>
                    <p>${ad.description}</p>
                </div>
            `).join('');
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        });

        loadAds();
    </script>
</body>
</html>
