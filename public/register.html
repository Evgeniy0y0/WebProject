<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація - AdBoard</title>
</head>
<body>
    <h1>Реєстрація нового користувача</h1>
    <form id="registerForm">
        <input type="text" id="name" placeholder="Ім'я" required><br><br>
        <input type="email" id="email" placeholder="Email" required><br><br>
        <input type="password" id="password" placeholder="Пароль (мін. 8 симв.)" required><br><br>
        <input type="password" id="confirmPassword" placeholder="Підтвердіть пароль" required><br><br>
        <button type="submit">Зареєструватися</button>
    </form>
    <p id="message" style="color: red;"></p>
    <p>Вже маєте аккаунт? <a href="/login.html">Увійти</a></p>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = document.getElementById('message');
            
            const body = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                confirmPassword: document.getElementById('confirmPassword').value
            };

            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await response.json();

            if (!response.ok) {
                message.textContent = data.message;
                return;
            }

            localStorage.setItem('token', data.token);
            message.style.color = 'green';
            message.textContent = 'Реєстрація успішна! Перенаправлення...';
            setTimeout(() => window.location.href = '/index.html', 1000);
        });
    </script>
</body>
</html>
